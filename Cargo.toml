[workspace]
resolver = "3"
members = ["crates/protocol", "crates/devices"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kindcat-ub/Chimerazer"
publish = false

[workspace.dependencies]
chimerazer-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
