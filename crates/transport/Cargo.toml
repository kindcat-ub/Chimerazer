[package]
name = "chimerazer-transport"
description = "Linux hidraw transport: device discovery through sysfs and feature-report exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"

[lints.rust]
# The two hidraw ioctls in `ioctl.rs` are the only unsafe code in the
# workspace; everything else keeps `forbid`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
