name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --workspace

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./.devcontainer/dev up --build -d
      - run: ./.devcontainer/dev exec -T dev cargo fmt --all --check
      - run: ./.devcontainer/dev exec -T dev cargo clippy --workspace --all-targets -- -D warnings
      - run: ./.devcontainer/dev exec -T dev cargo test --workspace
      - if: always()
        run: ./.devcontainer/dev down
